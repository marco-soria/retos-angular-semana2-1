<div class="min-h-screen bg-slate-100 flex flex-col lg:flex-row">
  <main class="flex-1 p-6 lg:p-10">
    <header class="mb-8">
      <h1 class="text-3xl font-bold text-slate-800">🛍️ Tienda Demo</h1>
      <p class="text-slate-500 mt-1">Ejercicio 0: output() y model() en un caso real</p>
    </header>

    <section class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
      <app-product-card [id]="productos[0].id" [nombre]="productos[0].nombre" [precio]="productos[0].precio" [imagen]="productos[0].imagen" (addToCart)="manejarAgregarAlCarrito($event)" />
      <app-product-card [id]="productos[1].id" [nombre]="productos[1].nombre" [precio]="productos[1].precio" [imagen]="productos[1].imagen" (addToCart)="manejarAgregarAlCarrito($event)" />
      <app-product-card [id]="productos[2].id" [nombre]="productos[2].nombre" [precio]="productos[2].precio" [imagen]="productos[2].imagen" (addToCart)="manejarAgregarAlCarrito($event)" />
      <app-product-card [id]="productos[3].id" [nombre]="productos[3].nombre" [precio]="productos[3].precio" [imagen]="productos[3].imagen" (addToCart)="manejarAgregarAlCarrito($event)" />
      <app-product-card [id]="productos[4].id" [nombre]="productos[4].nombre" [precio]="productos[4].precio" [imagen]="productos[4].imagen" (addToCart)="manejarAgregarAlCarrito($event)" />
      <app-product-card [id]="productos[5].id" [nombre]="productos[5].nombre" [precio]="productos[5].precio" [imagen]="productos[5].imagen" (addToCart)="manejarAgregarAlCarrito($event)" />
      <app-product-card [id]="productos[6].id" [nombre]="productos[6].nombre" [precio]="productos[6].precio" [imagen]="productos[6].imagen" (addToCart)="manejarAgregarAlCarrito($event)" />
      <app-product-card [id]="productos[7].id" [nombre]="productos[7].nombre" [precio]="productos[7].precio" [imagen]="productos[7].imagen" (addToCart)="manejarAgregarAlCarrito($event)" />
      <app-product-card [id]="productos[8].id" [nombre]="productos[8].nombre" [precio]="productos[8].precio" [imagen]="productos[8].imagen" (addToCart)="manejarAgregarAlCarrito($event)" />
      <app-product-card [id]="productos[9].id" [nombre]="productos[9].nombre" [precio]="productos[9].precio" [imagen]="productos[9].imagen" (addToCart)="manejarAgregarAlCarrito($event)" />
    </section>
  </main>

  <aside class="w-full lg:w-80 bg-slate-900 text-slate-100 p-6 lg:min-h-screen">
    <div class="flex items-center gap-3 mb-6">
      <span class="text-3xl">🛒</span>
      <h2 class="text-xl font-semibold">Tu Carrito</h2>

      <span
        class="ml-auto inline-flex items-center justify-center min-w-7 h-7 px-2 rounded-full bg-emerald-500 text-slate-900 font-bold text-sm transition-transform duration-300 scale-100"
      >
        0
      </span>
    </div>

    <div class="space-y-3">
      <div class="flex justify-between text-sm text-slate-300">
        <span>Total de items</span>
        <span class="font-medium text-white">{{ calcularCantidad() }}</span>
      </div>

      <div class="flex justify-between text-sm text-slate-300">
        <span>Total a pagar</span>
        <span class="font-semibold text-emerald-400">{{ calcularPrecioTotal() }}</span>
      </div>
    </div>
  </aside>
</div>
