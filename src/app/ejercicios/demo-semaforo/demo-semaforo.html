<div class="min-h-screen bg-slate-100 flex items-center justify-center p-6">
  <section class="bg-white rounded-2xl shadow p-8 max-w-md w-full">
    <h1 class="text-2xl font-bold text-slate-800 mb-1">2. Semáforo</h1>
    <p class="text-sm text-slate-500 mb-6">
      Usa <code class="bg-slate-100 px-1 rounded">output()</code>: cada luz emite el color seleccionado como string.
    </p>

    <div class="flex items-center gap-6">
      <app-semaforo (cambio)="alCambiarSemaforo($event)" />
      <span class="text-slate-700">Estado actual: <strong>{{ colorSemaforo() }}</strong></span>
    </div>
  </section>
</div>
