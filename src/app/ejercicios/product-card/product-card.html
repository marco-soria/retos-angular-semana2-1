<article
  class="bg-white rounded-2xl shadow-md hover:shadow-xl transition-shadow duration-300 p-5 flex flex-col items-center text-center"
>
  <img
    [src]="imagen()"
    [alt]="nombre()"
    class="w-full h-40 object-cover rounded-xl mb-4"
  />

  <h3 class="text-lg font-semibold text-slate-800">{{ nombre() }}</h3>
  <div class="flex justify-between gap-4">
    <p class="text-emerald-600 font-bold text-xl mt-1 mb-4">S/ {{ precio() }}</p>

    @if(stock() > 10 ){
      <p class="bg-green-500 text-xs mt-1 mb-4 rounded-2xl p-2">Disponible</p>
    } @else if(stock() > 0) {
      <p class="bg-amber-400 text-xs mt-1 mb-4 rounded-2xl p-2">Ultimas unidades</p>
    } @else {
      <p class="bg-red-600 text-xs mt-1 mb-4 rounded-2xl p-2">Agotado</p>
    }
  </div>

  <div class="flex items-center gap-4 mb-5">
    <button
      type="button"
      class="w-9 h-9 rounded-full bg-slate-200 text-slate-700 font-bold text-lg leading-none hover:bg-slate-300 transition-colors"
      aria-label="Disminuir cantidad"
      (click)="reducir()"
    >
      −
    </button>

    <span class="w-8 text-center font-semibold text-slate-800">{{ cantidad() }}</span>

    <button
      type="button"
      class="w-9 h-9 rounded-full bg-slate-200 text-slate-700 font-bold text-lg leading-none hover:bg-slate-300 transition-colors"
      aria-label="Aumentar cantidad"
      (click)="incrementar()"
    >
      +
    </button>
  </div>

  <button
    type="button"
    class="w-full py-2.5 rounded-xl bg-emerald-500 text-white font-medium hover:bg-emerald-600 active:scale-95 transition-all duration-150"
    (click)="agregarAlCarrito()"
  >
    Agregar al carrito
  </button>
</article>
