<div class="min-h-screen bg-slate-100 flex items-center justify-center p-6">
  <section class="bg-white rounded-2xl shadow p-8 max-w-md w-full">
    <h1 class="text-2xl font-bold text-slate-800 mb-1">1. Botón "Me gusta"</h1>
    <p class="text-sm text-slate-500 mb-6">
      Usa <code class="bg-slate-100 px-1 rounded">output()</code>: cada clic emite un evento sin datos (void).
    </p>

    <div class="flex items-center gap-4">
      <app-boton-me-gusta (megusta)="alDarMeGusta()" />
      <span class="text-slate-700">Total de likes: <strong>{{ totalMeGusta() }}</strong></span>
    </div>
  </section>
</div>
