<div class="min-h-screen bg-slate-100 flex items-center justify-center p-6">
  <section class="bg-white rounded-2xl shadow p-8 max-w-md w-full">
    <h1 class="text-2xl font-bold text-slate-800 mb-1">3. Buscador</h1>
    <p class="text-sm text-slate-500 mb-6">
      Usa <code class="bg-slate-100 px-1 rounded">output()</code>: un signal local guarda el texto y solo se
      emite al hacer clic en "Buscar".
    </p>

    <app-buscador (buscar)="alBuscar($event)" />
    <p class="text-slate-700 mt-4">
      Resultados para: <strong>{{ textoBuscado() }}</strong>
    </p>
  </section>
</div>
