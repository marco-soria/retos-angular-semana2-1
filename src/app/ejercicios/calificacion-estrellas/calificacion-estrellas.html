<div class="flex gap-1 text-3xl leading-none">
  @for (estrella of estrellas; track estrella) {
    <button
      type="button"
      class="hover:scale-125 transition-transform"
      [attr.aria-label]="'Calificar con ' + estrella + (estrella === 1 ? ' estrella' : ' estrellas')"
      (click)="calificar(estrella)"
    >
      <span [class.text-yellow-400]="estrella <= calificacion()" [class.text-slate-300]="estrella > calificacion()">
        ★
      </span>
    </button>
  }
</div>
